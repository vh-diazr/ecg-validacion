<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba rapida de ECG</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0f1b2d;color:#fff;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:8px 0}p{line-height:1.5;color:#c9d6ea}
.card{background:#16263f;border-radius:16px;padding:14px;margin-top:10px}
.bar{height:6px;background:#22375a;border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:#4cc9a7;width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#9fb3d1;margin:6px 0}
.tr{position:relative;margin-bottom:6px;line-height:0}.tr img{width:100%;border-radius:8px;background:#fff;display:block;user-select:none;-webkit-user-drag:none}
.mk .tr{cursor:crosshair}
.dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid #e8112d;border-radius:50%;background:rgba(232,17,45,.18);cursor:pointer}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{font-size:18px;padding:15px;border:0;border-radius:12px;background:#2b4a7a;color:#fff;cursor:pointer;font-weight:600}
button:hover{background:#3a5f9a}button.sure{background:#1f7a63}button.sure:hover{background:#27977a}
button.go{background:#4cc9a7;color:#08241d;width:100%;margin-top:12px}button:disabled{opacity:.4;cursor:default}
button.sm{font-size:14px;padding:8px 12px;background:#22375a}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{padding:9px 13px;border-radius:20px;background:#22375a;font-size:15px;font-weight:500;cursor:pointer}
.chip.on{background:#4cc9a7;color:#08241d}
.lvl{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}.lvl button{font-size:16px;padding:12px}.lvl button.on{background:#4cc9a7;color:#08241d}
textarea{width:100%;border-radius:10px;border:0;padding:10px;font-size:15px;min-height:56px;margin-top:6px;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.cap{font-size:14px;color:#c9d6ea;margin:6px 0;line-height:1.4}
.big{font-size:44px;font-weight:800;color:#4cc9a7}
small{color:#7f95b8}
</style></head><body><div class="wrap" id="app"></div>
